<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Finance Channel Official</title>
    <style>
        :root {
            --primary-color: #2c3e50; /* 落ち着いたネイビー */
            --accent-color: #e74c3c;  /* YouTubeの赤 */
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            margin-top: 20px;
        }

        .profile-icon {
            font-size: 50px;
            margin-bottom: 10px;
            display: block;
        }

        h1 { font-size: 1.4rem; margin: 0; color: var(--primary-color); }
        .subtitle { color: #666; font-size: 0.85rem; margin-top: 5px; }

        /* YouTube埋め込みエリア */
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            background: #000;
            margin-bottom: 25px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* リンクボタン */
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-card {
            background-color: var(--card-bg);
            padding: 16px;
            border-radius: 10px;
            text-decoration: none;
            color: var(--text-color);
            font-weight: bold;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.2s ease;
            border: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .link-card:active {
            transform: translateY(2px);
            box-shadow: none;
            background-color: #f0f0f0;
        }

        .btn-yt { border-bottom: 3px solid var(--accent-color); }
        .btn-blog { border-bottom: 3px solid #27ae60; }
        .btn-line { border-bottom: 3px solid #06c755; }

        footer {
            margin-top: 40px;
            font-size: 0.75rem;
            color: #999;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <span class="profile-icon">📈</span>
            <h1>My YouTube Channel</h1>
            <p class="subtitle">家計と資産を整える、実践的ファイナンス</p>
        </header>

        <!-- YouTube動画エリア：教えていただいたURLを埋め込みました -->
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/YKpMJHcC6Zc" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>

        <div class="links">
            <a href="https://www.youtube.com/watch?v=YKpMJHcC6Zc" class="link-card btn-yt">
                🔴 最新動画をチェック
            </a>
            <a href="#" class="link-card btn-blog">
                📝 公式ブログ（家計簿術など）
            </a>
            <a href="#" class="link-card btn-line">
                💬 公式LINEで相談・問い合わせ
            </a>
        </div>

        <footer>
            © 2026 Your Finance Brand<br>
            Powered by Gemini
        </footer>
    </div>

</body>
</html>
